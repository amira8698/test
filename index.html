<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة تطوير أميرة | Learning Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7fe;
            --card-bg: #ffffff;
            --text-main: #2b3674;
            --text-muted: #707ebe;
            --border-color: #e9edf7;
            --shadow: 0px 18px 40px rgba(112, 144, 176, 0.12);
            --radius: 16px;
            --primary: #4318ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; }
        .status-badge { text-align: center; font-size: 0.9rem; margin-bottom: 30px; font-weight: 600; color: var(--primary); }

        .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; }

        .stage-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .stage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }

        .stage-title { font-size: 1.3rem; font-weight: 800; color: var(--primary); }

        .skills-list { display: flex; flex-direction: column; gap: 15px; }
        .skill-item { background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #edf2f7; }
        .skill-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .skill-title { font-weight: 700; }
        .skill-percentage { font-weight: 700; padding: 3px 8px; border-radius: 6px; background: rgba(67, 24, 255, 0.1); color: var(--primary); }
        
        .progress-bar-bg { width: 100%; height: 10px; background-color: #e2e8f0; border-radius: 20px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg, #868CFF, #4318FF); transition: width 0.6s ease; }

        .controls { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        .controls input[type="number"] { width: 70px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 6px; text-align: center; }
        .controls button { padding: 5px 12px; border: none; border-radius: 6px; background: var(--text-main); color: white; cursor: pointer; font-weight: 600; }
        .controls button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎯 مسار تطور المهارات (Amira Roadmap)</h1>
        <p>متابعة التقدم عبر المراحل المختلفة</p>
    </div>
    <div class="status-badge" id="status">🔄 جاري قراءة البيانات...</div>

    <div class="container" id="stages-container"></div>

    <script>
        const BIN_ID = '6aa598b2ac6210605ac590d3'; 
        const MASTER_KEY = '$2a$10$.9wROdkipqRR.4oVTCgKVeCF8S6uHAS7WBL2uqfuSTb/.yNFqtuyO'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // الهيكل الافتراضي للمراحل
        const defaultStages = [
            {
                name: "المرحلة الأولى: الأساسيات (Stage 1)",
                skills: [
                    { title: "🌐 English", progress: 20 },
                    { title: "💻 Bash Script", progress: 70 },
                    { title: "🐍 Python", progress: 15 }
                ]
            },
            {
                name: "المرحلة الثانية: الحوسبة السحابية و CI/CD (Stage 2)",
                skills: [
                    { title: "☁️ Azure", progress: 40 },
                    { title: "📦 Git", progress: 0 },
                    { title: "⚙️ GitHub Actions", progress: 0 }
                ]
            },
            {
                name: "المرحلة الثالثة: الحاويات والإدارة (Stage 3)",
                skills: [
                    { title: "🐳 Docker", progress: 0 },
                    { title: "☸️ Kubernetes (K8s)", progress: 0 }
                ]
            },
            {
                name: "المرحلة الرابعة: البنية التحتية ككود والأتمتة (Stage 4)",
                skills: [
                    { title: "🏗️ Terraform", progress: 0 },
                    { title: "📜 Ansible", progress: 0 }
                ]
            }
        ];

        let stagesData = [];

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const result = await res.json();
                
                // إذا كان الملف السحابي يحتوي على البيانات نقرأها، وإلا نعتمد الهيكل الافتراضي
                stagesData = result.record.stages || defaultStages;
                document.getElementById('status').innerText = '🟢 متصل ومحفوظ سحابياً!';
                render();
            } catch (err) {
                document.getElementById('status').innerText = '❌ خطأ في الاتصال بالملف السحابي!';
                stagesData = defaultStages;
                render();
            }
        }

        async function saveData() {
            document.getElementById('status').innerText = '⏳ جاري الحفظ...';
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ stages: stagesData })
                });
                document.getElementById('status').innerText = '🟢 تم الحفظ بنجاح!';
                render();
            } catch (err) {
                alert('فشل حفظ البيانات!');
            }
        }

        function render() {
            const container = document.getElementById('stages-container');
            container.innerHTML = '';

            stagesData.forEach((stage, stageIdx) => {
                const stageEl = document.createElement('div');
                stageEl.className = 'stage-card';
                
                let skillsHTML = '';
                stage.skills.forEach((skill, skillIdx) => {
                    skillsHTML += `
                        <div class="skill-item">
                            <div class="skill-top">
                                <span class="skill-title">${skill.title}</span>
                                <span class="skill-percentage">${skill.progress}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${skill.progress}%;"></div>
                            </div>
                            <div class="controls">
                                <input type="number" min="0" max="100" value="${skill.progress}" id="input-${stageIdx}-${skillIdx}">
                                <button onclick="updateProgress(${stageIdx}, ${skillIdx})">تحديث النسبة</button>
                            </div>
                        </div>
                    `;
                });

                stageEl.innerHTML = `
                    <div class="stage-header">
                        <div class="stage-title">${stage.name}</div>
                    </div>
                    <div class="skills-list">${skillsHTML}</div>
                `;

                container.appendChild(stageEl);
            });
        }

        function updateProgress(stageIdx, skillIdx) {
            const input = document.getElementById(`input-${stageIdx}-${skillIdx}`);
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0; if (val > 100) val = 100;

            stagesData[stageIdx].skills[skillIdx].progress = val;
            saveData();
        }

        loadData();
    </script>
</body>
</html>
