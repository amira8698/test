<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amira | Cloud & DevOps Roadmap</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #10b981;
            --radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; min-height: 100vh; }
        
        .header { text-align: center; max-width: 700px; margin: 0 auto 30px auto; }
        .header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { color: var(--text-muted); font-size: 1.05rem; }
        .status-badge { text-align: center; font-size: 0.875rem; margin-bottom: 40px; font-weight: 600; color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; }

        .container { max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

        .stage-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            position: relative;
        }

        .stage-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--card-border);
        }

        .stage-title { font-size: 1.25rem; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .stage-badge { background: rgba(99, 102, 241, 0.15); color: #818cf8; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; text-transform: uppercase; }

        .skills-list { display: flex; flex-direction: column; gap: 18px; }
        .skill-item { background: #1f2937; padding: 18px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .skill-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .skill-title { font-weight: 600; font-size: 1rem; color: #e5e7eb; }
        .skill-percentage { font-weight: 700; font-size: 0.875rem; padding: 4px 10px; border-radius: 8px; background: rgba(16, 185, 129, 0.15); color: var(--accent); }
        
        .progress-bar-bg { width: 100%; height: 8px; background-color: #374151; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; border-radius: 10px; background: linear-gradient(90deg, #6366f1, #10b981); transition: width 0.5s ease; }

        .controls { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
        .controls input[type="number"] { width: 80px; padding: 6px 10px; background: #111827; border: 1px solid var(--card-border); color: #fff; border-radius: 8px; text-align: center; font-size: 0.875rem; }
        .controls button { padding: 6px 14px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-weight: 600; font-size: 0.875rem; transition: background 0.2s ease; }
        .controls button:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Amira's DevOps Journey</h1>
        <p>A structured roadmap for Cloud & Infrastructure Automation</p>
    </div>
    <div class="status-badge" id="status"><span>🔄</span> Connecting to cloud storage...</div>

    <div class="container" id="stages-container"></div>

    <script>
        const BIN_ID = 'YOUR_BIN_ID'; 
        const MASTER_KEY = 'YOUR_MASTER_KEY'; 
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        const defaultStages = [
            {
                name: "Stage 1: Core Fundamentals",
                skills: [
                    { title: "🌐 English Communication", progress: 20 },
                    { title: "💻 Bash Scripting", progress: 70 },
                    { title: "🐍 Python Programming", progress: 15 },
                    { title: "📦 Git & Version Control", progress: 0 }
                ]
            },
            {
                name: "Stage 2: Cloud & CI/CD Pipelines",
                skills: [
                    { title: "☁️ Microsoft Azure", progress: 40 },
                    { title: "⚙️ GitHub Actions", progress: 0 }
                ]
            },
            {
                name: "Stage 3: Containerization & Orchestration",
                skills: [
                    { title: "🐳 Docker", progress: 0 },
                    { title: "☸️ Kubernetes (K8s)", progress: 0 }
                ]
            },
            {
                name: "Stage 4: Infrastructure as Code & Automation",
                skills: [
                    { title: "🏗️ Terraform", progress: 0 },
                    { title: "📜 Ansible", progress: 0 }
                ]
            }
        ];

        let stagesData = [];

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const result = await res.json();
                stagesData = result.record.stages || defaultStages;
                document.getElementById('status').innerHTML = '<span>🟢</span> Live Cloud Sync Active';
                render();
            } catch (err) {
                document.getElementById('status').innerHTML = '<span>❌</span> Connection Failed - Showing Local Data';
                stagesData = defaultStages;
                render();
            }
        }

        async function saveData() {
            document.getElementById('status').innerHTML = '<span>⏳</span> Saving updates...';
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ stages: stagesData })
                });
                document.getElementById('status').innerHTML = '<span>🟢</span> Saved successfully!';
                render();
            } catch (err) {
                alert('Failed to update cloud storage.');
            }
        }

        function render() {
            const container = document.getElementById('stages-container');
            container.innerHTML = '';

            stagesData.forEach((stage, stageIdx) => {
                const stageEl = document.createElement('div');
                stageEl.className = 'stage-card';
                
                let skillsHTML = '';
                stage.skills.forEach((skill, skillIdx) => {
                    skillsHTML += `
                        <div class="skill-item">
                            <div class="skill-top">
                                <span class="skill-title">${skill.title}</span>
                                <span class="skill-percentage">${skill.progress}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${skill.progress}%;"></div>
                            </div>
                            <div class="controls">
                                <input type="number" min="0" max="100" value="${skill.progress}" id="input-${stageIdx}-${skillIdx}">
                                <button onclick="updateProgress(${stageIdx}, ${skillIdx})">Update Progress</button>
                            </div>
                        </div>
                    `;
                });

                stageEl.innerHTML = `
                    <div class="stage-header">
                        <div class="stage-title">${stage.name}</div>
                        <span class="stage-badge">Phase ${stageIdx + 1}</span>
                    </div>
                    <div class="skills-list">${skillsHTML}</div>
                `;

                container.appendChild(stageEl);
            });
        }

        function updateProgress(stageIdx, skillIdx) {
            const input = document.getElementById(`input-${stageIdx}-${skillIdx}`);
            let val = parseInt(input.value) || 0;
            if (val < 0) val = 0; if (val > 100) val = 100;

            stagesData[stageIdx].skills[skillIdx].progress = val;
            saveData();
        }

        loadData();
    </script>
</body>
</html>
